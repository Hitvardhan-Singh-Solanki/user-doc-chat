# SonarQube Configuration for user-doc-chat
sonar.projectKey=user-doc-chat
sonar.projectName=User Document Chat
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.js,**/*.spec.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/tests/**,**/mocks/**,**/fixtures/**

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage configuration
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.js,**/*.spec.js,**/tests/**,**/mocks/**,**/fixtures/**,**/dist/**,**/node_modules/**

# Code quality configuration
sonar.typescript.eslint.reportPaths=eslint-report.json
sonar.javascript.eslint.reportPaths=eslint-report.json

# Security configuration
sonar.security.hotspots.includeAllFiles=true

# Duplication configuration
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.js,**/*.spec.js,**/tests/**,**/mocks/**,**/fixtures/**

# Language detection
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.file.suffixes=.js,.jsx

# Import paths
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage thresholds
sonar.coverage.minimum=80
sonar.coverage.required=true

# Complexity thresholds
sonar.complexity.max=8
sonar.complexity.required=true

# Maintainability rating
sonar.maintainability.rating.minimum=A

# Reliability rating
sonar.reliability.rating.minimum=A

# Security rating
sonar.security.rating.minimum=A
