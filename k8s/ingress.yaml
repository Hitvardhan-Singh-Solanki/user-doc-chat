apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-doc-chat-ingress
  namespace: user-doc-chat-production
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:123456789012:certificate/your-cert-id
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  rules:
  - host: user-doc-chat.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: user-doc-chat-service
            port:
              number: 80
  tls:
  - hosts:
    - user-doc-chat.com
    secretName: user-doc-chat-tls
