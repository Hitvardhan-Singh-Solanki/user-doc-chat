apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-doc-chat-app
  namespace: user-doc-chat-production
  labels:
    app: user-doc-chat
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-doc-chat
  template:
    metadata:
      labels:
        app: user-doc-chat
        environment: production
    spec:
      containers:
      - name: app
        image: ghcr.io/hitvardhan-singh-solanki/user-doc-chat:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: S3_BUCKET
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CORS_ORIGINS
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JWT_EXPIRES_IN
        - name: LLM_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LLM_SERVICE_URL
        - name: CRAWLER_MAX_BYTES
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CRAWLER_MAX_BYTES
        - name: CRAWLER_MAX_PAGES
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CRAWLER_MAX_PAGES
        - name: RATE_LIMIT_WINDOW_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RATE_LIMIT_WINDOW_MS
        - name: RATE_LIMIT_MAX_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RATE_LIMIT_MAX_REQUESTS
        - name: CIRCUIT_BREAKER_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CIRCUIT_BREAKER_THRESHOLD
        - name: CIRCUIT_BREAKER_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CIRCUIT_BREAKER_TIMEOUT_MS
        - name: VECTOR_DIMENSIONS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: VECTOR_DIMENSIONS
        - name: VECTOR_DISTANCE_OPERATOR
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: VECTOR_DISTANCE_OPERATOR
        - name: EMBEDDING_MODEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: EMBEDDING_MODEL
        - name: CHUNK_SIZE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CHUNK_SIZE
        - name: CHUNK_OVERLAP
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CHUNK_OVERLAP
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: OPENAI_API_KEY
        - name: HUGGINGFACE_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: HUGGINGFACE_API_KEY
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: PINECONE_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1001
      restartPolicy: Always