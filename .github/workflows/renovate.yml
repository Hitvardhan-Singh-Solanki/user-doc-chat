name: Renovate

on:
  workflow_dispatch:
    inputs:
      renovateFlags:
        description: 'Renovate flags'
        required: false
        default: '--dry-run'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          fetch-depth: 0

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v43.0.20
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_FLAGS: ${{ github.event.inputs.renovateFlags || '--dry-run' }}
