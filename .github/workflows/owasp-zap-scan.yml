name: OWASP ZAP Security Scan

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        default: 'http://localhost:3000'

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          npm run build
          npm start &
          sleep 30  # Wait for app to start

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Generate ZAP Report
        run: |
          mkdir -p reports
          # ZAP reports are automatically generated by the action
          cp zap_report.html reports/ 2>/dev/null || echo "ZAP report not found"
          cp zap_report.json reports/ 2>/dev/null || echo "ZAP JSON report not found"

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Comment on PR with ZAP Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `## 🛡️ OWASP ZAP Security Scan Results

            ### 🔍 Scan Details:
            - **Target**: http://localhost:3000
            - **Scan Type**: Baseline + Full Scan
            - **Status**: ${job.status}

            ### 📊 Results:
            - ZAP security reports are available in the workflow artifacts
            - Download and review the HTML/JSON reports
            - Fix any high/critical severity issues before merging

            ### 🚨 Common Issues to Check:
            - Missing security headers
            - XSS vulnerabilities
            - SQL injection points
            - Authentication bypasses
            - Information disclosure

            ---
            *This comment was automatically generated by the OWASP ZAP security scan*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
