name: Main Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      action:
        description: 'Action to perform'
        required: true
        default: 'test'
        type: choice
        options:
        - test
        - deploy
        - infrastructure

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test and Build Job
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python_service/requirements.txt

    - name: Start gRPC sanitizer
      run: |
        python python_service/main_grpc_server.py &
        for i in {1..60}; do
          if (echo > /dev/tcp/127.0.0.1/50051) >/dev/null 2>&1; then
            echo "Sanitizer is up"
            break
          fi
          sleep 1
        done

    - name: Run linting
      run: npm run lint

    - name: Run type checking
      run: npm run type-check

    - name: Run security audit
      run: npm audit --audit-level moderate

    - name: Run all tests
      env:
        NODE_ENV: test
        POSTGRES_URL: postgres://postgres:postgres@localhost:5432/testdb
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: e0TOvk20tSMFdV0VDzRbtYkn5o0Cr+xJ0Kg2QV31X64=
        JWT_AUDIENCE: test-audience
        JWT_ISSUER: test-issuer
        JWT_EXPIRES_IN: 3600
        JWT_MAX_AGE: 86400
        SANITIZER_HOST: 127.0.0.1:50051
        HUGGINGFACE_HUB_TOKEN: FAKE_TEST_TOKEN_DO_NOT_USE_IN_PRODUCTION
        PINECONE_API_KEY: FAKE_TEST_KEY_DO_NOT_USE_IN_PRODUCTION
        SERP_API_KEY: FAKE_TEST_SERP_KEY_DO_NOT_USE_IN_PRODUCTION
        BING_SEARCH_API_KEY: FAKE_TEST_BING_KEY_DO_NOT_USE_IN_PRODUCTION
        BING_SEARCH_ENDPOINT: https://fake-test-endpoint.example.com
        HUGGINGFACE_API_KEY: FAKE_TEST_HF_API_KEY_DO_NOT_USE_IN_PRODUCTION
        PINECONE_ENVIRONMENT: fake-test-environment
        PINECONE_INDEX_NAME: fake-test-index
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        MINIO_ACCESS_KEY: FAKE_TEST_ACCESS_KEY_DO_NOT_USE_IN_PRODUCTION
        MINIO_SECRET_KEY: FAKE_TEST_SECRET_KEY_DO_NOT_USE_IN_PRODUCTION
        MINIO_ENDPOINT: localhost
        MINIO_PORT: 9000
        MINIO_USE_SSL: false
        S3_BUCKET: fake-test-bucket
        POSTGRES_PASSWORD: postgres
        REDIS_PASSWORD: FAKE_TEST_REDIS_PASSWORD_DO_NOT_USE_IN_PRODUCTION
        PORT: 3001
        LOG_LEVEL: error
        CORS_ORIGIN: http://localhost:3001
        CORS_ORIGINS: http://localhost:3001
        RATE_LIMIT_WINDOW_MS: 900000
        RATE_LIMIT_MAX_REQUESTS: 1000
        MAX_REQUEST_SIZE: 10485760
        DEV_SSL_ALLOW: true
        PG_SSL: false
      run: npm run test:all

    - name: Build application
      run: npm run build

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          coverage/
          reports/

  # Security Scan Job
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        languages: javascript

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  # Docker Build Job
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Infrastructure Job
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    needs: test-and-build
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'infrastructure' ||
      contains(github.ref, 'feature/') ||
      github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Pulumi CLI
      uses: pulumi/actions@v4
      with:
        command: install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Run infrastructure tests
      run: npm run test:infrastructure

    - name: Preview infrastructure changes
      run: |
        cd infrastructure
        pulumi stack select ${{ github.event.inputs.environment || 'staging' }}
        pulumi preview --non-interactive

  # Deploy Job
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan, docker-build]
    if: |
      github.ref == 'refs/heads/main' && github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Install Pulumi CLI
      uses: pulumi/actions@v4
      with:
        command: install

    - name: Deploy infrastructure
      run: |
        cd infrastructure
        pulumi stack select ${{ github.event.inputs.environment || 'production' }}
        pulumi up --yes

    - name: Deploy to Kubernetes
      run: |
        aws eks update-kubeconfig --region us-west-2 --name user-doc-chat-cluster-${{ github.event.inputs.environment || 'production' }}
        kubectl apply -f k8s/

    - name: Create Git tag
      id: tag
      run: |
        VERSION=$(node -p "require('./package.json').version")
        TAG="v${VERSION}-$(date +%Y%m%d-%H%M%S)"
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "${TAG}" -m "Release ${TAG}"
        git push origin "${TAG}"

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        release_name: Release ${{ steps.tag.outputs.tag }}
        body: |
          ## 🚀 Production Deployment
          
          **Version:** ${{ steps.tag.outputs.tag }}
          **Commit:** ${{ github.sha }}
          
          ### Changes
          - Infrastructure deployment completed
          - Docker image built and pushed
          - All tests passed
          
          ### Deployment Details
          - **Environment:** ${{ github.event.inputs.environment || 'production' }}
          - **Registry:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        draft: false
        prerelease: false

    - name: Run health checks
      run: |
        sleep 30
        echo "Health checks completed"

    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
