name: Test Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python-deps-${{ hashFiles('python_service/requirements.txt') }}
          restore-keys: |
            python-deps-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r python_service/requirements.txt

      - name: Start gRPC sanitizer (background)
        run: |
          python python_service/main_grpc_server.py &
          set -euo pipefail
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/50051) >/dev/null 2>&1; then
              echo "Sanitizer is up"
              break
            fi
            sleep 1
          done
          if ! (echo > /dev/tcp/127.0.0.1/50051) >/dev/null 2>&1; then
            echo "Sanitizer did not start within 60s" >&2
            exit 1
          fi

      - name: Run tests
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          # FAKE JWT SECRET FOR TESTING ONLY - DO NOT USE IN PRODUCTION
          JWT_SECRET: e0TOvk20tSMFdV0VDzRbtYkn5o0Cr+xJ0Kg2QV31X64=
          JWT_AUDIENCE: test-audience
          JWT_ISSUER: test-issuer
          JWT_EXPIRES_IN: 3600
          JWT_MAX_AGE: 86400
          SANITIZER_HOST: 127.0.0.1:50051
          # FAKE TEST VALUES - DO NOT USE IN PRODUCTION
          HUGGINGFACE_HUB_TOKEN: FAKE_TEST_TOKEN_DO_NOT_USE_IN_PRODUCTION
          PINECONE_API_KEY: FAKE_TEST_KEY_DO_NOT_USE_IN_PRODUCTION
          SERP_API_KEY: FAKE_TEST_SERP_KEY_DO_NOT_USE_IN_PRODUCTION
          BING_SEARCH_API_KEY: FAKE_TEST_BING_KEY_DO_NOT_USE_IN_PRODUCTION
          BING_SEARCH_ENDPOINT: https://fake-test-endpoint.example.com
          HUGGINGFACE_API_KEY: FAKE_TEST_HF_API_KEY_DO_NOT_USE_IN_PRODUCTION
          PINECONE_ENVIRONMENT: fake-test-environment
          PINECONE_INDEX_NAME: fake-test-index
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
          # FAKE STORAGE CREDENTIALS - DO NOT USE IN PRODUCTION
          MINIO_ACCESS_KEY: FAKE_TEST_ACCESS_KEY_DO_NOT_USE_IN_PRODUCTION
          MINIO_SECRET_KEY: FAKE_TEST_SECRET_KEY_DO_NOT_USE_IN_PRODUCTION
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_USE_SSL: false
          S3_BUCKET: fake-test-bucket
          POSTGRES_PASSWORD: postgres
          REDIS_PASSWORD: FAKE_TEST_REDIS_PASSWORD_DO_NOT_USE_IN_PRODUCTION
          # Application Configuration
          PORT: 3001
          LOG_LEVEL: error
          # Security Configuration
          CORS_ORIGIN: http://localhost:3001
          CORS_ORIGINS: http://localhost:3001
          RATE_LIMIT_WINDOW_MS: 900000
          RATE_LIMIT_MAX_REQUESTS: 1000
          MAX_REQUEST_SIZE: 10485760
          # Test-specific overrides
          DEV_SSL_ALLOW: true
          PG_SSL: false
        run: npm test

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
