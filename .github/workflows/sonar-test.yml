name: SonarQube Test (Local)

on:
  workflow_dispatch: # Manual trigger only
  push:
    branches: [fix/complexity] # Only on this branch for testing

jobs:
  sonar-test:
    name: SonarQube Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm run coverage

      - name: Generate ESLint report
        run: npm run lint -- --format json --output-file eslint-report.json || true

      - name: Check coverage files
        run: |
          echo "Coverage files generated:"
          ls -la coverage/
          echo "LCOV file exists:"
          test -f coverage/lcov.info && echo "✅ coverage/lcov.info exists" || echo "❌ coverage/lcov.info missing"
          echo "HTML coverage exists:"
          test -f coverage/index.html && echo "✅ coverage/index.html exists" || echo "❌ coverage/index.html missing"

      - name: Display coverage summary
        run: |
          echo "📊 Coverage Summary:"
          if [ -f coverage/lcov.info ]; then
            echo "LCOV file size: $(wc -c < coverage/lcov.info) bytes"
            echo "First few lines of LCOV:"
            head -5 coverage/lcov.info
          else
            echo "❌ No LCOV file found"
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=user-doc-chat
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.eslint.reportPaths=eslint-report.json
            -Dsonar.javascript.eslint.reportPaths=eslint-report.json
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.js,**/*.spec.js,**/tests/**,**/mocks/**,**/fixtures/**,**/dist/**,**/node_modules/**
            -Dsonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.js,**/*.spec.js,**/tests/**,**/mocks/**,**/fixtures/**
            -Dsonar.typescript.tsconfigPath=tsconfig.json
            -Dsonar.coverage.minimum=80
            -Dsonar.complexity.max=8
            -Dsonar.maintainability.rating.minimum=A
            -Dsonar.reliability.rating.minimum=A
            -Dsonar.security.rating.minimum=A

      - name: Display setup instructions
        run: |
          echo "📊 Coverage generation completed successfully"
          echo "📋 To enable SonarQube analysis, add these secrets to your repository:"
          echo "  - SONAR_TOKEN"
          echo "  - SONAR_HOST_URL" 
          echo "  - SONAR_ORGANIZATION (for SonarCloud)"
          echo ""
          echo "See docs/SONARQUBE_SECRETS_SETUP.md for detailed instructions"
