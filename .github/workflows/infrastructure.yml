name: Infrastructure Pipeline

on:
  push:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure.yml'
  pull_request:
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      action:
        description: 'Action to perform'
        required: true
        default: 'preview'
        type: choice
        options:
        - preview
        - up
        - destroy
        - refresh

env:
  NODE_VERSION: '18'

jobs:
  # Infrastructure Validation
  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run infrastructure tests
      run: npm run test:infrastructure

    - name: Install Pulumi CLI
      uses: pulumi/actions@v4
      with:
        command: install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Validate infrastructure configuration
      run: |
        cd infrastructure
        pulumi preview --non-interactive

  # Infrastructure Preview
  preview-infrastructure:
    name: Preview Infrastructure Changes
    runs-on: ubuntu-latest
    needs: validate-infrastructure
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'preview')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Pulumi CLI
      uses: pulumi/actions@v4
      with:
        command: install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Preview infrastructure changes
      run: |
        cd infrastructure
        pulumi stack select ${{ github.event.inputs.environment || 'staging' }}
        pulumi preview --non-interactive

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const preview = fs.readFileSync('infrastructure-preview.txt', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🏗️ Infrastructure Preview\n\n\`\`\`\n${preview}\n\`\`\``
          });

  # Deploy Infrastructure
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate-infrastructure
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up')
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Pulumi CLI
      uses: pulumi/actions@v4
      with:
        command: install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Deploy infrastructure
      run: |
        cd infrastructure
        pulumi stack select ${{ github.event.inputs.environment || 'staging' }}
        pulumi up --yes

    - name: Export infrastructure outputs
      run: |
        cd infrastructure
        pulumi stack output --json > infrastructure-outputs.json
        echo "Infrastructure deployed successfully!"

    - name: Upload infrastructure outputs
      uses: actions/upload-artifact@v4
      with:
        name: infrastructure-outputs
        path: infrastructure/infrastructure-outputs.json

    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#infrastructure'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow

  # Destroy Infrastructure
  destroy-infrastructure:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Pulumi CLI
      uses: pulumi/actions@v4
      with:
        command: install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Destroy infrastructure
      run: |
        cd infrastructure
        pulumi stack select ${{ github.event.inputs.environment }}
        pulumi destroy --yes

    - name: Notify destruction
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#infrastructure'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow

  # Infrastructure Health Check
  health-check:
    name: Infrastructure Health Check
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: always() && needs.deploy-infrastructure.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Download infrastructure outputs
      uses: actions/download-artifact@v4
      with:
        name: infrastructure-outputs

    - name: Run health checks
      run: |
        # Get infrastructure outputs
        ALB_DNS=$(jq -r '.albDnsName' infrastructure-outputs.json)
        echo "ALB DNS: $ALB_DNS"
        
        # Wait for services to be ready
        sleep 60
        
        # Check EKS cluster
        aws eks describe-cluster --name user-doc-chat-cluster-${{ github.event.inputs.environment || 'staging' }} --region us-west-2
        
        # Check RDS instance
        aws rds describe-db-instances --db-instance-identifier user-doc-chat-db-${{ github.event.inputs.environment || 'staging' }} --region us-west-2
        
        # Check Redis cluster
        aws elasticache describe-replication-groups --replication-group-id user-doc-chat-redis-${{ github.event.inputs.environment || 'staging' }} --region us-west-2
        
        # Check S3 bucket
        aws s3 ls s3://user-doc-chat-bucket-${{ github.event.inputs.environment || 'staging' }} --region us-west-2
        
        echo "All infrastructure components are healthy!"

    - name: Notify health check results
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#infrastructure'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
