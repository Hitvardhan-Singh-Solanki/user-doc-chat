name: user-doc-chat-infra
runtime:
  name: nodejs
  options:
    typescript: true
description: Infrastructure for User Doc Chat application
template:
  config:
    aws:region:
      description: The AWS region to deploy to
      default: us-west-2
    environment:
      description: The environment name (dev, staging, prod)
      default: prod
    domain:
      description: The domain name for the application
      default: user-doc-chat.com
