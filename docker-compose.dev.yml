version: '3.9'

services:
  # Development application with hot reload
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=development
    command: npm run dev
    depends_on:
      - db
      - redis
      - minio
      - python-service

  # Python gRPC service (development)
  python-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - '50051:50051'
    volumes:
      - ./python_service:/app
      - ./certs:/app/certs:ro
    environment:
      - PYTHONPATH=/app/services

  # PostgreSQL database
  db:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=user_doc_chat_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/init-db.d:/docker-entrypoint-initdb.d

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

  # MinIO object storage
  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data: