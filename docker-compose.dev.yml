services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app
      - /app/node_modules
      # Mount TLS certificates for gRPC sanitizer service
      - ./certs:/app/certs:ro
    ports:
      - '3000:3000'
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/user_doc_chat
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=user_doc_chat
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - POSTGRES_PASSWORD=postgres
      # Redis Configuration
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # JWT Configuration
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
      - JWT_EXPIRES_IN=3600
      - JWT_AUDIENCE=user-doc-chat-dev
      - JWT_ISSUER=user-doc-chat-dev
      - JWT_MAX_AGE=86400
      # Application Configuration
      - NODE_ENV=development
      - PORT=3000
      - LOG_LEVEL=debug
      # Storage Configuration
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - S3_BUCKET=user-doc-chat-dev
      # Security Configuration
      - CORS_ORIGIN=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      # Sanitizer Service
      - SANITIZER_HOST=python_apis:50051
      - SANITIZER_TIMEOUT=30000
      # Required secrets (set to placeholder values for development)
      - HUGGINGFACE_HUB_TOKEN=your_huggingface_token_here
      - PINECONE_API_KEY=your_pinecone_api_key_here
    depends_on:
      - db
      - redis
      - minio
      - python_apis

  python_apis:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    volumes:
      - ./python_service:/app
      # Mount TLS certificates for gRPC server
      - ./certs:/app/certs:ro
    ports:
      - '50051:50051'
    env_file:
      - .env.dev
    depends_on:
      - db
      - redis

  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.pg
    container_name: db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=user_doc_chat
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d user_doc_chat']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

volumes:
  db_data:
  redis_data:
  minio_data:
